# Deploy nach Cloudflare Pages (Projekt „wattwas“). Läuft nur, wenn die Secrets gesetzt sind:
#   CLOUDFLARE_API_TOKEN (Pages: Edit), CLOUDFLARE_ACCOUNT_ID
# Solange sie fehlen, wird der Job übersprungen; GitHub Pages (deploy.yml) bleibt aktiv.
# Umstellung: Secrets setzen → dieser Workflow deployt → DNS auf Cloudflare → deploy.yml löschen, Repo privat.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_PAGES == 'on' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=wattwas --branch=main
