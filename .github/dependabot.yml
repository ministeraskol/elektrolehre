# Monatliche Versions-Updates für die GitHub Actions (Dependabot zieht SHA-Pin und Versionskommentar mit).
# Kein npm-Eintrag: npm-Sicherheitsupdates laufen separat (Repo-Einstellung „Dependabot security updates“).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
